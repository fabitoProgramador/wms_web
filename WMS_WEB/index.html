  <script src="js/services/mapaCamarasBackendAdapter.js"></script>
  <script src="js/services/grueroBackendAdapter.js"></script>

  <!-- Panel de Control: sólo modelos RPC -->
  <script src="js/models/dashboardModel.js"></script>
  <script src="js/models/dashboardAnalysisModel.js"></script>
  <script src="js/models/dashboardMonitorModel.js"></script>

  <!-- Operaciones: backend autoritativo -->
  <script src="js/models/operacionesBackendModel.js"></script>

  <!-- Stock/lotes productivos RPC; StockModel es sólo una fachada síncrona del snapshot backend. -->
  <script src="js/models/stockModel.js"></script>
  <script src="js/models/stockPlantaModel.js"></script>
  <script src="js/models/loteDetalladoModel.js"></script>
  <script src="js/models/bitacoraModel.js"></script>
  <script src="js/models/verificacionesModel.js"></script>

  <!-- Operación Inventario: snapshot/cola offline + adaptador Supabase -->
  <script src="js/models/inventoryOperationModel.js"></script>
  <script src="js/services/inventoryOperationService.js"></script>
  <script src="js/services/inventoryBackendAdapter.js"></script>

  <!-- Reportes Operacionales -->
  <script src="js/models/reportesModel.js"></script>
  <script src="js/models/reportesStockModel.js"></script>

  <!-- Centro de Etiquetas: preferencias locales + snapshot/cola offline explícitos -->
  <script src="js/services/labelFormatService.js"></script>
  <script src="js/services/zebraPrintService.js"></script>
  <script src="js/services/labelService.js"></script>

  <script src="js/views/components/palletDrawer.js"></script>
  <script src="js/views/components/palletLabelTemplate.js"></script>
  <script src="js/views/components/cameraHUD.js"></script>

  <!-- Controladores -->
  <script src="js/controllers/authController.js"></script>
  <script src="js/controllers/dashboardController.js"></script>
  <script src="js/controllers/dashboardAnalysisController.js"></script>
  <script src="js/controllers/dashboardMonitorController.js"></script>
  <script src="js/controllers/mapaController.js"></script>
  <script src="js/controllers/mapaCodigoController.js"></script>
  <script src="js/controllers/mapaInventarioController.js"></script>
  <script src="js/controllers/grueroController.js"></script>
  <script src="js/controllers/inventoryOperationController.js"></script>
  <script src="js/controllers/stockPlantaController.js"></script>
  <script src="js/controllers/loteDetalladoController.js"></script>
  <script src="js/controllers/stockController.js"></script>
  <script src="js/controllers/labelController.js"></script>
  <script src="js/controllers/andenController.js"></script>
  <script src="js/services/andenPackingService.js"></script>
  <script src="js/controllers/andenBackendController.js"></script>
  <script src="js/services/andenBackendIntegration.js"></script>
  <script src="js/controllers/operacionesController.js"></script>
  <script src="js/controllers/operacionesBackendController.js"></script>
  <script src="js/controllers/reportesController.js"></script>
  <script src="js/controllers/reportesStockController.js"></script>
  <script src="js/controllers/bitacoraOperativaController.js"></script>
  <script src="js/controllers/verificacionesController.js"></script>
  <script src="js/controllers/bitacoraController.js"></script>
  <script src="js/controllers/userAdminController.js"></script>
  <script src="js/controllers/appController.js"></script>

  <!-- Adaptadores de Mapa todavía requeridos por el visor principal. -->
  <script src="js/services/mapaProterBackendBridge.js"></script>
  <script src="js/services/mapaPostTunelBackendBridge.js"></script>
  <script src="js/services/mapaCamarasActionGuard.js"></script>
  <script src="js/services/mapaSubmodulosBackendBridge.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await BackendBootstrapService.prepararInicio();
      BackendBootstrapService.instalarHooks();

      // Primero se hidratan los snapshots offline derivados del backend. Ningún
      // módulo crea datos de negocio locales durante el arranque.
      await LabelService.initialize();
      LabelService.install();
      GrueroBackendAdapter.install();
      InventoryBackendAdapter.install();

      MapaCamarasLegacyIsolation.install();
      MapaProterBackendBridge.install();
      MapaPostTunelBackendBridge.install();
      MapaCamarasActionGuard.install();
      MapaSubmodulosBackendBridge.install();
      AndenBackendIntegration.install();
      NavigationPermissionService.install(AppController);
      AppController.init();
    });
  </script>
</body>
</html>
